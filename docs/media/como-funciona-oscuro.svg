<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Cómo funciona Altrune</title>
  <desc id="d">Cuatro pasos: sueltas un instalador, Altrune elige o crea una botella, instala y busca el programa, y lo abres con un clic. Un resalte recorre los pasos en bucle.</desc>
  <style>
    :root { --panel:#1C1E22; --card:#26282D; --line:#3A3D45; --ink:#E8EAEE; --muted:#A3A9B5; --icon:#8C94A5; --accent:#7AA5FF; --tint:#263870; --badge:#343842; --badgetext:#D0D4DC; --badgeon:#10152A; --glow:#7AA5FF; }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .glow { fill: none; stroke: var(--glow); stroke-width: 8; opacity: 0; }
    .badge { fill: var(--badge); }
    .num { fill: var(--badgetext); font-size: 15px; font-weight: 700; }
    .title { fill: var(--ink); font-size: 16.5px; font-weight: 700; }
    .sub { fill: var(--muted); font-size: 13px; }
    .foot { fill: var(--muted); font-size: 13px; }
    .ic { stroke: var(--icon); }
    .icf { fill: var(--icon); stroke: var(--card); }
    .exe { fill: var(--icon); stroke: none; font-size: 11px; font-weight: 700; }
    .track { stroke: var(--icon); }
    .bar { fill: var(--icon); transform-box: fill-box; transform-origin: left center; }
    .arrow { fill: none; stroke: var(--icon); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
    .drop, .cursor { transform-box: fill-box; transform-origin: center; }
    .s1 { --d: 0s; } .s2 { --d: 3s; } .s3 { --d: 6s; } .s4 { --d: 9s; }

    /* One 12 s loop; every step is lit for about 3 s, one after another. */
    .card, .glow, .badge, .num, .ic, .icf, .exe, .track, .bar, .drop, .cursor, .arrow {
      animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: ease-in-out;
      animation-delay: var(--d);
    }
    .card  { animation-name: k-card; }
    .glow  { animation-name: k-glow; }
    .badge { animation-name: k-badge; }
    .num   { animation-name: k-num; }
    .ic    { animation-name: k-ic; }
    .icf   { animation-name: k-icf; }
    .exe   { animation-name: k-exe; }
    .track { animation-name: k-ic; }
    .bar   { animation-name: k-bar; }
    .drop  { animation-name: k-drop; }
    .cursor{ animation-name: k-cursor; }
    .arrow { animation-name: k-arrow; }

    @keyframes k-card  { 0% { fill: var(--card); stroke: var(--line); } 3%, 22% { fill: var(--tint); stroke: var(--accent); } 27%, 100% { fill: var(--card); stroke: var(--line); } }
    @keyframes k-glow  { 0% { opacity: 0; } 3%, 22% { opacity: .22; } 27%, 100% { opacity: 0; } }
    @keyframes k-badge { 0% { fill: var(--badge); } 3%, 22% { fill: var(--accent); } 27%, 100% { fill: var(--badge); } }
    @keyframes k-num   { 0% { fill: var(--badgetext); } 3%, 22% { fill: var(--badgeon); } 27%, 100% { fill: var(--badgetext); } }
    @keyframes k-ic    { 0% { stroke: var(--icon); } 3%, 22% { stroke: var(--accent); } 27%, 100% { stroke: var(--icon); } }
    @keyframes k-icf   { 0% { fill: var(--icon); } 3%, 22% { fill: var(--accent); } 27%, 100% { fill: var(--icon); } }
    @keyframes k-exe   { 0% { fill: var(--icon); } 3%, 22% { fill: var(--accent); } 27%, 100% { fill: var(--icon); } }
    @keyframes k-bar   { 0% { transform: scaleX(.15); fill: var(--icon); } 3% { transform: scaleX(.15); fill: var(--accent); } 20% { transform: scaleX(1); fill: var(--accent); } 22% { transform: scaleX(1); fill: var(--accent); } 27%, 100% { transform: scaleX(1); fill: var(--icon); } }
    @keyframes k-drop  { 0% { transform: translateY(0); stroke: var(--icon); } 2% { transform: translateY(-9px); stroke: var(--accent); } 14%, 100% { transform: translateY(0); } }
    @keyframes k-cursor{ 0%, 8% { transform: translate(5px, 5px); } 12% { transform: translate(0, 0) scale(.9); } 16%, 100% { transform: translate(0, 0) scale(1); } }
    @keyframes k-arrow { 0%, 22% { stroke: var(--icon); opacity: .55; } 28%, 36% { stroke: var(--accent); opacity: 1; } 42%, 100% { stroke: var(--icon); opacity: .55; } }

    @media (prefers-reduced-motion: reduce) {
      .card, .glow, .badge, .num, .ic, .icf, .exe, .track, .bar, .drop, .cursor, .arrow { animation: none; }
    }
  </style>
  <rect class="panel" width="960" height="330" rx="24"/>
  <g class="step s1">
    <rect class="glow" x="30" y="34" width="204" height="232" rx="18"/>
    <rect class="card" x="30" y="34" width="204" height="232" rx="18"/>
    <circle class="badge" cx="62" cy="66" r="14"/>
    <text class="num" x="62" y="71.5" text-anchor="middle">1</text>
    <g transform="translate(132 122)">
      <g class="ic drop" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-15 -30 H5 L15 -20 V6 a4 4 0 0 1 -4 4 H-11 a4 4 0 0 1 -4 -4 Z"/>
        <path d="M5 -30 V-20 H15"/>
        <text class="exe" x="0" y="-3" text-anchor="middle">EXE</text>
      </g>
      <path class="ic" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M-26 8 V20 a4 4 0 0 0 4 4 H22 a4 4 0 0 0 4 -4 V8"/>
    </g>
    <text class="title" x="132" y="194" text-anchor="middle">Suelta un instalador</text>
    <text class="sub" x="132" y="216" text-anchor="middle">Arrastra un .exe o .msi</text>
    <text class="sub" x="132" y="234" text-anchor="middle">a la ventana de Altrune</text>
  </g>
  <path class="arrow s1" d="M244 142 L252 150 L244 158"/>
  <g class="step s2">
    <rect class="glow" x="262" y="34" width="204" height="232" rx="18"/>
    <rect class="card" x="262" y="34" width="204" height="232" rx="18"/>
    <circle class="badge" cx="294" cy="66" r="14"/>
    <text class="num" x="294" y="71.5" text-anchor="middle">2</text>
    <g transform="translate(364 122)">
      <g class="ic" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-6 -28 H6 V-16 C6 -8 17 -8 17 4 V21 A7 7 0 0 1 10 28 H-10 A7 7 0 0 1 -17 21 V4 C-17 -8 -6 -8 -6 -16 Z"/>
        <path d="M-9 -23 H9"/>
        <rect x="-10" y="6" width="20" height="13" rx="3"/>
      </g>
    </g>
    <text class="title" x="364" y="194" text-anchor="middle">Elige o crea una botella</text>
    <text class="sub" x="364" y="216" text-anchor="middle">Altrune propone una</text>
    <text class="sub" x="364" y="234" text-anchor="middle">y te dice por qué</text>
  </g>
  <path class="arrow s2" d="M476 142 L484 150 L476 158"/>
  <g class="step s3">
    <rect class="glow" x="494" y="34" width="204" height="232" rx="18"/>
    <rect class="card" x="494" y="34" width="204" height="232" rx="18"/>
    <circle class="badge" cx="526" cy="66" r="14"/>
    <text class="num" x="526" y="71.5" text-anchor="middle">3</text>
    <g transform="translate(596 122)">
      <g class="ic" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-28" y="-24" width="56" height="48" rx="8"/>
        <path d="M-28 -12 H28"/>
        <rect x="-18" y="-2" width="36" height="7" rx="3.5" class="track" stroke-width="2"/>
        <rect x="-18" y="-2" width="36" height="7" rx="3.5" class="bar" stroke="none"/>
        <path d="M-12 14 l5 5 l9 -9" stroke-width="2.6"/>
      </g>
    </g>
    <text class="title" x="596" y="194" text-anchor="middle">Instala el programa</text>
    <text class="sub" x="596" y="216" text-anchor="middle">Ejecuta el instalador y</text>
    <text class="sub" x="596" y="234" text-anchor="middle">busca lo que se instaló</text>
  </g>
  <path class="arrow s3" d="M708 142 L716 150 L708 158"/>
  <g class="step s4">
    <rect class="glow" x="726" y="34" width="204" height="232" rx="18"/>
    <rect class="card" x="726" y="34" width="204" height="232" rx="18"/>
    <circle class="badge" cx="758" cy="66" r="14"/>
    <text class="num" x="758" y="71.5" text-anchor="middle">4</text>
    <g transform="translate(828 122)">
      <g class="ic" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-26" y="-28" width="46" height="46" rx="12"/>
        <path d="M-9 -16 L8 -5 L-9 6 Z"/>
      </g>
      <g class="cursor"><path class="icf" stroke-width="2" stroke-linejoin="round" d="M6 6 V30 L12.5 24.5 L17 34 L22 31.8 L17.5 22.5 L26 22 Z"/></g>
    </g>
    <text class="title" x="828" y="194" text-anchor="middle">Ábrelo con un clic</text>
    <text class="sub" x="828" y="216" text-anchor="middle">Desde la biblioteca de</text>
    <text class="sub" x="828" y="234" text-anchor="middle">programas de Altrune</text>
  </g>
  <text class="foot" x="480" y="302" text-anchor="middle">Todo ocurre en tu Mac. Las botellas viven solo en la carpeta de Altrune.</text>
</svg>
