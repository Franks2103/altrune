<?xml version="1.0" encoding="UTF-8"?>
<!--
  Altrune installer background (the picture behind the two icons in the DMG window).
  Editable source: sh tools/dmg/generar-fondo.sh renders it to fondo.png (1x), fondo@2x.png and
  fondo.tiff (both resolutions in one file, what Finder reads).

  Size: 660 x 416 points. The window's content area is 660 x 400 or a little more (the title bar
  is a few points taller or shorter between macOS versions), so the last 16 points are spare and
  only repeat the background. Where things must sit (content coordinates, top left origin):
    app icon centre      (165, 190)   128 points wide, label below
    Applications centre  (495, 190)   same size and height
    arrow                from x 288 to x 372 at y 190, in the gap between the two icons
    sentence             centred at x 330, baseline y 372
  These numbers are also in tools/dmg/ajustes.py.

  Colours come from the brand palette (assets/branding/paleta.md and the graphite of the app's
  dark theme): graphite #1D1E22 and #17181B, blue-violet #2C3CCF to #8D81FC, sky #5F99FD.
  The background is light on purpose: in the tests made here (macOS 27, Dark appearance, a light
  and a dark graphite test background) Finder drew the icon labels in black on both, so the
  label area is kept light. Light appearance was not captured.

  The sentence is outlined (a path, not live text) so it renders the same on every Mac. It was
  made with tools/dmg/trazar-texto.swift from Ubuntu-Light.ttf, the font egui already brings
  inside the app (crate epaint_default_fonts 0.37.0, Ubuntu Font Licence 1.0; see
  THIRD_PARTY_NOTICES.md). No Apple font is used. "Drag Altrune to Applications", 13 points,
  0.4 letter spacing, 175.33 points wide. The logo is NOT drawn here: the icons are the real
  ones from the app and from macOS.
-->
