      <stop offset="0" stop-color="#8D81FC" stop-opacity="0.36"/>
      <stop offset="0.45" stop-color="#5F99FD" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2C3CCF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flecha" gradientUnits="userSpaceOnUse" x1="288" y1="0" x2="374" y2="0">
